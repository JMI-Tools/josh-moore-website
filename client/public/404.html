<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Josh Moore</title>
    <link rel="icon" type="image/png" href="/logo-jm.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      :root {
        --ink: #0a1628;
        --muted: #5b6b7f;
        --line: #e2e8f0;
        --accent: #2563eb;
        --page: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: var(--page);
        color: var(--ink);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
      }

      main {
        width: 100%;
        max-width: 34rem;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 3rem 2.25rem;
        text-align: center;
        box-shadow: 0 1px 3px rgba(10, 22, 40, 0.06);
      }

      .logo {
        height: 3.25rem;
        width: auto;
        margin: 0 auto 2rem;
        display: block;
      }

      .code {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.875rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      p {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 1.0625rem;
      }

      .actions {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      a.button {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.9375rem;
        text-decoration: none;
        border: 1px solid transparent;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      a.primary {
        background: var(--accent);
        color: #ffffff;
      }

      a.primary:hover {
        background: #1d4ed8;
      }

      a.secondary {
        background: #ffffff;
        color: var(--ink);
        border-color: var(--line);
      }

      a.secondary:hover {
        border-color: #cbd5e1;
      }

      .links {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
        font-size: 0.875rem;
        color: var(--muted);
      }

      .links a {
        color: var(--muted);
        text-decoration: none;
        white-space: nowrap;
      }

      .links a:hover {
        color: var(--ink);
        text-decoration: underline;
      }

      .links span {
        margin: 0 0.5rem;
        color: var(--line);
      }

      @media (max-width: 30rem) {
        main {
          padding: 2.25rem 1.5rem;
        }

        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <img class="logo" src="/logo-jm.png" alt="Josh Moore" />

      <p class="code">Error 404</p>
      <h1>This page doesn't exist</h1>
      <p>
        The link may be out of date, or the address may have been typed
        incorrectly. Everything else is still where you left it.
      </p>

      <div class="actions">
        <a class="button primary" href="/">Back to homepage</a>
        <a class="button secondary" href="/contact">Get in touch</a>
      </div>

      <div class="links">
        <a href="/about">About</a><span>&middot;</span>
        <a href="/buy-box">Buy Box</a><span>&middot;</span>
        <a href="/submit-deal">Submit a Deal</a><span>&middot;</span>
        <a href="/resources">Resources</a>
      </div>
    </main>
  </body>
</html>
