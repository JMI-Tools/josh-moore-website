<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Josh Moore</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      /*
        Static 404. Mirrors client/src/pages/NotFound.tsx: navy page, white
        type, one button home. System font only, so nothing has to load
        before the page reads.
      */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.25rem;
        text-align: center;
        color: #ffffff;
        background-color: #0a1e32;
        background-image:
          radial-gradient(60% 60% at 70% 20%, rgba(77, 146, 208, 0.28) 0%, rgba(77, 146, 208, 0) 70%),
          radial-gradient(40% 40% at 10% 90%, rgba(77, 146, 208, 0.14) 0%, rgba(77, 146, 208, 0) 70%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
      }

      .logo {
        display: block;
        height: 3.5rem;
        width: auto;
        margin: 0 auto 3rem;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #dbe9f7;
      }

      h1 {
        margin: 1rem 0 0;
        font-size: clamp(2.75rem, 6.2vw, 5rem);
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.03em;
      }

      p.line {
        margin: 1.5rem auto 0;
        max-width: 28rem;
        font-size: 1.125rem;
        color: rgba(255, 255, 255, 0.78);
      }

      a.button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2.25rem;
        height: 3.25rem;
        padding: 0 2rem;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        color: #0a1e32;
        background: #ffffff;
        transition: background-color 0.2s ease;
      }

      a.button:hover {
        background: #f5f3ee;
      }

      a.button:focus-visible {
        outline: 3px solid rgba(77, 146, 208, 0.4);
        outline-offset: 2px;
      }

      @media (min-width: 768px) {
        p.line {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <a href="/" aria-label="Josh Moore, home">
        <img class="logo" src="/logo-jm-480.webp" width="96" height="64" alt="Josh Moore" />
      </a>
      <p class="eyebrow">Error</p>
      <h1>404</h1>
      <p class="line">That page is not here.</p>
      <a class="button" href="/">Back to the homepage <span aria-hidden="true">&rarr;</span></a>
    </main>
  </body>
</html>
